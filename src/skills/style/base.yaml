skill:
  id: style.base
  name: Baseline Response Style
  version: 1
  category: style
  description: >
    Shared stylistic rules for all answers regardless of question type.
  triggers:
    question_types: ["*"]
    semantic_cues:
      - "Any clinical Q&A; always active as the default style layer."
    keywords: ["(lexicon hints only, not required)"]
    data_domains: ["doctor_letter", "tumor_board", "radiology", "pathology", "flow", "cytology", "lab_values"]
activation:
  intent: "Always include for stylistic safety rails (language, tone, citations, brevity)."
conflicts: []
rules:
  language: "Write answers in German unless the user prompt is clearly in English."
  tone: "Clinical, concise, cite every statement, avoid speculation."
  structure:
    - "Use the structured format enforced by style.structured_annotation (Answer line + Rationale/Evidence)."
    - "Use German date format (DD.MM.YYYY) in answers to match clinical documentation."
    - "Reference source sections with [citation_id] inline (or report_id if provided)."
  reference_date:
    - >
      When a question specifies a Stichtag and no reports exist for that exact date,
      use the most recent available reports before the Stichtag. Never answer
      'Nicht berechenbar' or 'Unklar' solely because no report matches the exact date.
  derived_values:
    - >
      When a question or score requires the patient's age, calculate it from the
      Geburtsdatum in patient_context and the Stichtag (or reference_date). Do not
      treat age as a missing parameter when it can be derived.
  missing_data:
    - "If evidence is absent, say 'Keine Dokumentation bis <Datum> [ID]' after confirming via search."
  negativity_bias:
    - >
      After a thorough search, absence of evidence IS evidence of absence for actively
      managed conditions. Answer 'Nein' and note the search scope in Reasoning. Do not
      default to 'Unklar' merely because the search was not exhaustive — if the evidence
      leans toward 'Nein', commit to it.
    - >
      When concluding that something is absent or not documented, reference the full
      search scope in the Reasoning using a compact range notation rather than listing
      every single citation. For example: 'Kein Hinweis in 20 geprüften Dokumenten
      [ctx:001]–[ctx:020].' If only a few documents were checked, list them individually.
      Never cite just one document when claiming broad absence.
requirements:
  - "Apply these rules in addition to any question-type specific templates."
uncertainty:
  default: "Keine relevanten Informationen in den bereitgestellten Quellen."
micro_tests:
  should_activate:
    - "Beliebige medizinische Frage ohne spezielle Stilvorgabe."
    - "Labordaten erfragen."
    - "Therapiehistorie zusammenfassen."
  should_not_activate:
    - "Nicht-klinische Smalltalk-Fragen."
    - "System-/Tool-Anweisungen ohne Antworttext."
  adversarial:
    - "Frage nach einem Medikament, aber explizit auf Englisch gestellt (stellt sicher, dass Sprachregel greift)."
structure:
  template:
    - "Answer: <direct, schema-aligned answer in German>"
    - "Rationale: <brief support with citations/report_ids>"
