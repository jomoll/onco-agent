skill:
  id: style.structured_annotation.tr
  name: Structured Answer Format — Turkish
  version: 1.1
  category: style
  inherits:
    - style.base.tr
  description: >
    Enforces structured answers matching annotation UI format using concrete examples — Turkish variant.
    Each schema type shows: format with all options, concrete example, and common mistakes.
  triggers:
    question_types: ["*"]
    semantic_cues:
      - "Use whenever producing patient-facing answers that should align with annotation schemas."
activation:
  intent: "Default formatting layer for clinical Q&A to mirror annotation schemas."
conflicts: []
structure:
  template:
    - "Answer: <schema-aligned value(s) or Abstain>"
    - "Reasoning: <1–2 sentences with inline citations [ctx:ID]>"
rules:
  answer_formats:
    single_choice: |
      Format: Answer: <option from schema>
      Example: Answer: Evet
               Reasoning: 23.07.2021 tarihli tıbbi mektupta Daratumumab tedavisi belgelenmiştir [ctx:001].
      ❌ WRONG: "Evet, hasta alıyor..." (no extra words in Answer line)

    two_single_choice: |
      Format: Answer: <label1>=<option1>; <label2>=<option2>
      Example: Answer: Şu anda=Evet; Daha önce=Hayır
               Reasoning: Bortezomib ile mevcut tedavi devam ediyor [ctx:002], CAR-T belgelenmemiş [ctx:005].
      ❌ WRONG: Adding explanations in Answer line

    yn_plus_short_text: |
      Format: Answer: Evet/Hayır/Belirsiz | <brief text>
      Example: Answer: Evet | Nötropeni nedeniyle doz %75'e düşürüldü
               Reasoning: Carfilzomib doz azaltımı tedavi seyrinde belgelenmiştir [ctx:003].
      ❌ WRONG: Adding citations in Answer line

    answer_plus_single_choice: |
      Format: Answer: Kategori=<option>; Yanıt=<text>
      Example: Answer: Kategori=CR; Yanıt=KRD tedavisi en iyi yanıtı sağladı
               Reasoning: KRD'nin 3 siklusundan sonra CR belgelenmiştir [ctx:007].

    criteria_table_plus_final: |
      Format: Answer: Criteria: <criterion1>=Karşılandı/Karşılanmadı/Eksik; ... | Final: Evet/Hayır/Belirsiz
      Example: Answer: Criteria: ECOG≤2=Karşılandı; Böbrek fonksiyonu=Karşılanmadı; Aktif enfeksiyonlar=Karşılandı; FISH=Eksik | Final: Hayır
               Reasoning: ECOG 1 belgelenmiştir [ctx:004], ancak GFR <30 ml/min [ctx:006]. Aktif enfeksiyon belgelenmemiştir. FISH sonucu dosyada mevcut değildir.
      NOTE on 'Eksik' vs 'Karşılandı' for exclusion criteria: When a criterion checks for the
      ABSENCE of a condition and the condition is not mentioned in the record, mark as 'Karşılandı'.
      'Eksik' is reserved for criteria requiring a specific positive test or value never performed/documented.
      NOTE on Final verdict: Commit to Evet or Hayır when the majority of criteria are resolved.

    multi_interval_up_to_3: |
      Format: Answer: Status=Belgelenmiş/Hiç uygulanmadı/Belgelenmemiş/Belirsiz || (Start=DD.MM.YYYY, End=DD.MM.YYYY/Devam ediyor); ...
      Example: Answer: Status=Belgelenmiş || 08.10.2022 - 18.10.2022; 15.07.2023 - 24.07.2023
               Reasoning: Meropenem 08.–18.10.2022 [ctx:002] ve 15.–24.07.2023 [ctx:008] tarihlerinde uygulanmıştır.
      ❌ WRONG: Using vague dates or missing Status field

    cycle_start_dose_list: |
      Format: Answer: Status=Belgelenmiş/Hiç uygulanmadı/Belgelenmemiş/Belirsiz || <DD.MM.YYYY> | <dose> | <unit>; ...
      Example: Answer: Status=Belgelenmiş || 05.12.2018 | 5 | mg; 09.01.2019 | 10 | mg
               Reasoning: Siklus 1, 05.12.2018 tarihinde 5 mg [ctx:001]; siklus 2, 09.01.2019 tarihinde 10 mg [ctx:003].
      ❌ WRONG: C1D1: 05.12.2018 (use calendar dates DD.MM.YYYY, NEVER cycle labels)
      Note: Rows only appear when Status=Belgelenmiş

    melphalan_exposure_episode_up_to_3: |
      Format: Answer: Status=Belgelenmiş/Hiç uygulanmadı/Belgelenmemiş/Belirsiz || <Tip Yüksek doz/ASCT|Rejim> | <DD.MM.YYYY> | <dose> | <unit>; ...
      Example: Answer: Status=Belgelenmiş || Yüksek doz/ASCT | 03.03.2014 | 100 | mg/m^2
               Reasoning: İlk HD-Melfalan Mart 2014'te [ctx:002].
      Note: Max 3 episodes, Rows only when Status=Belgelenmiş

    doxo_exposure_episode_up_to_3: |
      Format: Answer: Status=Belgelenmiş/Hiç uygulanmadı/Belgelenmemiş/Belirsiz || <Form Konvansiyonel|Lipozomal|Belirsiz> | <DD.MM.YYYY> | <dose> | <unit>; ...
      Example: Answer: Status=Belgelenmiş || Konvansiyonel | 25.06.2021 | 20 | mg
               Reasoning: Haziran 2021'de 20 mg konvansiyonel doksorubicin belgelenmiştir [ctx:004].
      Note: Max 3 episodes, Rows only when Status=Belgelenmiş

    count_plus_interval: |
      Format: Answer: Count=1/2/3/4/5/Belgelenmemiş/Belirsiz | Start=DD.MM.YYYY | End=DD.MM.YYYY
      Example: Answer: Count=3 | Start=10.05.2021 | End=15.08.2021
               Reasoning: Mayıs–Ağustos 2021 arasında üç transfüzyon belgelenmiştir [ctx:005].

    date_or_not_documented: |
      Format: Answer: <DD.MM.YYYY or MM.YYYY or Belgelenmemiş or Belirsiz>
      Example: Answer: 10/2018
               Reasoning: İlk böbrek yetmezliği Ekim 2018'de belgelenmiştir [ctx:003].

    score_value_plus_date_and_source: |
      Format: Answer: <score value> | <DD.MM.YYYY> | Belgelenmiş/Hesaplandı
      Format (not calculable): Answer: Durum: hesaplanamaz
      Format (unclear): Answer: Belirsiz
      Example: Answer: 0 | 15.10.2018 | Belgelenmiş
               Reasoning: ECOG skoru 0, 15.10.2018 tarihli tıbbi mektupta açıkça belgelenmiştir [ctx:002].
      Example: Answer: ISS II | 15.10.2018 | Hesaplandı
               Reasoning: 15.10.2018 tarihli albümin 3.2 g/dl ve β2-mikroglobulin 4.5 mg/l değerlerinden hesaplanmıştır [ctx:002].
      Example: Answer: Durum: hesaplanamaz
               Reasoning: ISS hesaplaması için gereken β2-mikroglobulin değerleri mevcut raporlarda bulunmamaktadır [ctx:005].
      ❌ WRONG: "Belirsiz" when score cannot be calculated (use "Durum: hesaplanamaz")

    free_text: |
      Format: Answer: <brief text>
      Example: Answer: Plazma hücrelerinde %5'ten %18'e artış
               Reasoning: 10.03.2019 tarihli kemik iliği biyopsisi %5 [ctx:001], 15.07.2021 tarihli biyopsi %18 göstermektedir [ctx:004].

    list: |
      Format: Answer: Items: <item1>; <item2>; ...
      Example: Answer: Items: Lenalidomid; Bortezomib; Daratumumab
               Reasoning: Her üç ajan tedavi geçmişinde belgelenmiştir [ctx:002][ctx:005].

    abstain: |
      Format: Answer: Abstain
      Example: Answer: Abstain
               Reasoning: Birden fazla raporda dozaj konusunda çelişkili bilgi mevcuttur [ctx:003][ctx:007].

  evidence:
    - "Cite evidence ONLY in Reasoning using provided [ctx:ID] format"
    - "Never add citations, prose, or explanations in the Answer line"
    - "Do not invent evidence; if insufficient, use Abstain."
    - "'Belgelenmemiş' means NO relevant clinical documentation exists at all. If ANY documentation exists and the queried finding is absent → 'Hayır'."
    - "For therapy response questions (schema includes 'Hiç uygulanmadı'): if therapy not in treatment history → 'Hiç uygulanmadı'."
    - "When claiming absence, reference the full search scope using compact range notation, e.g. '[ctx:001]–[ctx:020]'."

  rationale:
    - "ALWAYS provide Reasoning with citations, even for simple answers"
    - "Keep to ≤2 sentences unless complex criteria require more"

  separators:
    - "Status/Rows split: ||"
    - "Multiple rows: ;"
    - "Within row fields: |"
    - "Multiple items in list: ;"

requirements:
  - "Final output MUST have exactly two lines: 'Answer:' and 'Reasoning:'"
  - "Answer line must match schema format exactly - use examples as templates"
  - "Never add citations, evidence, or extra prose to Answer line"
  - "If data missing: 'Durum: hesaplanamaz' ONLY for score_value schemas, 'Belirsiz' for yn/eligibility schemas, 'Belgelenmemiş' for therapy/date schemas."
  - "Respect all schema options (Evet/Hayır/Belirsiz/Belgelenmemiş/Abstain/etc.)"
  - "For list schemas with Status field: Rows only appear when Status=Belgelenmiş"

micro_tests:
  should_activate:
    - "Any clinical Q&A requiring structured output"
  should_not_activate:
    - "Non-clinical conversations"
  adversarial:
    - "Date fields must always use calendar format (DD.MM.YYYY), never cycle notation"
